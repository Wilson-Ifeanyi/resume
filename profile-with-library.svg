<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" role="img" aria-labelledby="title desc">
  <title id="title">Professional portrait with library background</title>
  <desc id="desc">Ifeanyi Wilson Okafor with a professional library background</desc>
  
  <defs>
    <linearGradient id="wallGradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#8b7d6b"/>
      <stop offset="100%" stop-color="#6b5d4f"/>
    </linearGradient>
    <linearGradient id="bookShelfGradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#5a4a3a"/>
      <stop offset="100%" stop-color="#3a2a1a"/>
    </linearGradient>
  </defs>

  <!-- Library Wall Background -->
  <rect width="1000" height="1200" fill="url(#wallGradient)"/>
  
  <!-- Wooden bookshelves structure -->
  <g id="bookshelf">
    <!-- Shelf backs -->
    <rect x="0" y="100" width="1000" height="1100" fill="url(#bookShelfGradient)"/>
    
    <!-- Top shelf -->
    <rect x="20" y="150" width="960" height="40" fill="#4a3a2a" rx="2"/>
    <!-- Books on top shelf -->
    <rect x="30" y="120" width="45" height="50" fill="#8b4513" opacity="0.8"/>
    <rect x="80" y="110" width="50" height="60" fill="#2c3e50" opacity="0.8"/>
    <rect x="135" y="125" width="40" height="45" fill="#c41e3a" opacity="0.8"/>
    <rect x="180" y="115" width="48" height="55" fill="#556b2f" opacity="0.8"/>
    <rect x="235" y="128" width="45" height="42" fill="#8b0000" opacity="0.8"/>
    <rect x="285" y="120" width="50" height="50" fill="#1a1a2e" opacity="0.8"/>
    <rect x="340" y="118" width="46" height="52" fill="#d4a574" opacity="0.8"/>
    <rect x="392" y="125" width="44" height="45" fill="#2f4f4f" opacity="0.8"/>
    <rect x="442" y="120" width="50" height="50" fill="#b8860b" opacity="0.8"/>
    <rect x="500" y="115" width="48" height="55" fill="#654321" opacity="0.8"/>
    <rect x="555" y="122" width="45" height="48" fill="#4b0082" opacity="0.8"/>
    <rect x="607" y="118" width="50" height="52" fill="#a0522d" opacity="0.8"/>
    <rect x="665" y="125" width="46" height="45" fill="#1f4788" opacity="0.8"/>
    <rect x="718" y="120" width="48" height="50" fill="#8b4513" opacity="0.8"/>
    <rect x="773" y="128" width="44" height="42" fill="#2d5016" opacity="0.8"/>
    <rect x="824" y="118" width="50" height="52" fill="#6b4423" opacity="0.8"/>
    <rect x="882" y="125" width="48" height="45" fill="#4a235a" opacity="0.8"/>
    <rect x="937" y="120" width="43" height="50" fill="#8b0000" opacity="0.8"/>

    <!-- Middle shelf -->
    <rect x="20" y="400" width="960" height="40" fill="#4a3a2a" rx="2"/>
    <!-- Books on middle shelf -->
    <rect x="30" y="360" width="50" height="60" fill="#1a472a" opacity="0.8"/>
    <rect x="85" y="370" width="45" height="50" fill="#8b4513" opacity="0.8"/>
    <rect x="135" y="365" width="48" height="55" fill="#c41e3a" opacity="0.8"/>
    <rect x="190" y="375" width="45" height="45" fill="#000080" opacity="0.8"/>
    <rect x="240" y="368" width="50" height="52" fill="#8b0000" opacity="0.8"/>
    <rect x="297" y="375" width="46" height="45" fill="#556b2f" opacity="0.8"/>
    <rect x="350" y="368" width="50" height="52" fill="#2f4f4f" opacity="0.8"/>
    <rect x="407" y="370" width="44" height="50" fill="#8b4513" opacity="0.8"/>
    <rect x="458" y="365" width="48" height="55" fill="#d4a574" opacity="0.8"/>
    <rect x="513" y="370" width="46" height="50" fill="#4b0082" opacity="0.8"/>
    <rect x="566" y="368" width="50" height="52" fill="#654321" opacity="0.8"/>
    <rect x="623" y="373" width="45" height="47" fill="#1f4788" opacity="0.8"/>
    <rect x="675" y="368" width="48" height="52" fill="#8b4513" opacity="0.8"/>
    <rect x="730" y="370" width="50" height="50" fill="#a0522d" opacity="0.8"/>
    <rect x="787" y="365" width="46" height="55" fill="#2d5016" opacity="0.8"/>
    <rect x="840" y="375" width="50" height="45" fill="#6b4423" opacity="0.8"/>
    <rect x="897" y="368" width="44" height="52" fill="#4a235a" opacity="0.8"/>

    <!-- Lower shelf -->
    <rect x="20" y="650" width="960" height="40" fill="#4a3a2a" rx="2"/>
    <!-- Books on lower shelf -->
    <rect x="30" y="610" width="48" height="60" fill="#8b0000" opacity="0.8"/>
    <rect x="85" y="620" width="50" height="50" fill="#1a472a" opacity="0.8"/>
    <rect x="140" y="615" width="45" height="55" fill="#8b4513" opacity="0.8"/>
    <rect x="192" y="625" width="48" height="45" fill="#c41e3a" opacity="0.8"/>
    <rect x="247" y="618" width="46" height="52" fill="#000080" opacity="0.8"/>
    <rect x="300" y="625" width="50" height="45" fill="#556b2f" opacity="0.8"/>
    <rect x="357" y="618" width="44" height="52" fill="#2f4f4f" opacity="0.8"/>
    <rect x="408" y="620" width="50" height="50" fill="#d4a574" opacity="0.8"/>
    <rect x="465" y="615" width="46" height="55" fill="#8b4513" opacity="0.8"/>
    <rect x="518" y="620" width="48" height="50" fill="#4b0082" opacity="0.8"/>
    <rect x="573" y="618" width="50" height="52" fill="#654321" opacity="0.8"/>
    <rect x="630" y="623" width="45" height="47" fill="#1f4788" opacity="0.8"/>
    <rect x="682" y="618" width="48" height="52" fill="#a0522d" opacity="0.8"/>
    <rect x="737" y="620" width="50" height="50" fill="#8b4513" opacity="0.8"/>
    <rect x="794" y="615" width="46" height="55" fill="#2d5016" opacity="0.8"/>
    <rect x="847" y="625" width="50" height="45" fill="#6b4423" opacity="0.8"/>
    <rect x="904" y="618" width="46" height="52" fill="#4a235a" opacity="0.8"/>
  </g>

  <!-- Subtle library lighting/ambiance -->
  <circle cx="500" cy="300" r="400" fill="#ffffff" opacity="0.03"/>
  
  <!-- Desk/Platform for subject -->
  <rect x="150" y="900" width="700" height="80" fill="#5a4a3a" rx="4" opacity="0.6"/>
  
  <!-- Subject portrait area (placeholder for actual photo) -->
  <circle cx="500" cy="500" r="250" fill="#e8dcc4" stroke="#8b7d6b" stroke-width="3"/>
  
  <!-- Add soft vignette -->
  <defs>
    <radialGradient id="vignette" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="1200" fill="url(#vignette)"/>
</svg>
